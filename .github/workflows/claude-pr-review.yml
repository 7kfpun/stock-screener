name: OpenRouter PR Review and Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'public/data/**'
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  openrouter-review:
    # Run on: automated PRs with public/data changes OR manual /review comment.
    # The comment path is restricted to people who can already write to the
    # repo: this repository is public, the job spends real OpenRouter credit on
    # every run, and without the author_association check any visitor could
    # drain the account by commenting "/review" on any PR.
    if: |
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'automated')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Initial checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get PR details
        id: pr-details
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Direct PR event
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "pr_ref=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
            echo "is_automated=true" >> $GITHUB_OUTPUT
          else
            # Comment trigger - get PR details from API
            PR_NUMBER=${{ github.event.issue.number }}
            PR_DATA=$(gh pr view $PR_NUMBER --json headRefName,labels)
            PR_REF=$(echo "$PR_DATA" | jq -r '.headRefName')
            HAS_AUTOMATED_LABEL=$(echo "$PR_DATA" | jq -r '[.labels[].name] | contains(["automated"])')

            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "pr_ref=$PR_REF" >> $GITHUB_OUTPUT
            echo "is_automated=$HAS_AUTOMATED_LABEL" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr-details.outputs.pr_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: OpenRouter PR Review
        # The summaries are an enrichment; the CSV is what the daily run exists
        # to produce. An OpenRouter-side failure -- account out of credits, API
        # outage, missing key -- must never strand the data PR unmerged, so this
        # step is allowed to fail without failing the job. Real CI failures are
        # still caught by the "Wait for checks" gate below.
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-haiku-4.5:online' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/openrouter_pr_review.py
          python scripts/openrouter_pr_review.py

      - name: Wait for checks
        if: steps.pr-details.outputs.is_automated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
          # This job reports its own check run on the PR. Excluding it is what
          # keeps the wait from blocking on itself forever.
          SELF_CHECK: openrouter-review
          # Long enough for PR Checks to finish (it runs in about a minute),
          # short enough to stay inside the job's timeout alongside the
          # OpenRouter call above.
          WAIT_TIMEOUT_SECONDS: "480"
          POLL_INTERVAL_SECONDS: "15"
          # Checks are registered a little after the PR event, so a zero count
          # early on means "not yet", not "none".
          REGISTER_GRACE_SECONDS: "45"
        run: |
          set -uo pipefail

          # Previously this slept 30s, took a single snapshot, and treated
          # PENDING as passing -- so it happily merged before CI had finished.
          # Poll until every other check has actually settled instead.
          start=$(date +%s)
          deadline=$(( start + WAIT_TIMEOUT_SECONDS ))

          while :; do
            # gh exits non-zero while checks are failing or still pending, so
            # capture the payload without letting `bash -e` kill the step.
            checks=$(gh pr checks "$PR_NUMBER" --json name,state 2>/dev/null || echo '[]')
            others=$(jq --arg self "$SELF_CHECK" '[.[] | select(.name != $self)]' <<<"$checks")

            total=$(jq -r 'length' <<<"$others")
            failed=$(jq -r '[.[] | select(.state=="FAILURE" or .state=="ERROR" or .state=="CANCELLED" or .state=="TIMED_OUT")] | length' <<<"$others")
            pending=$(jq -r '[.[] | select(.state=="PENDING" or .state=="QUEUED" or .state=="IN_PROGRESS" or .state=="WAITING")] | length' <<<"$others")

            if [ "$failed" -gt 0 ]; then
              echo "::error::$failed check(s) failed - not auto-merging."
              jq -r '.[] | select(.state=="FAILURE" or .state=="ERROR" or .state=="CANCELLED" or .state=="TIMED_OUT") | "  \(.name): \(.state)"' <<<"$others"
              exit 1
            fi

            elapsed=$(( $(date +%s) - start ))

            if [ "$pending" -eq 0 ]; then
              if [ "$total" -gt 0 ]; then
                echo "All $total check(s) passed."
                break
              fi
              # PR Checks sets paths-ignore on public/data/**, so a data-only
              # PR legitimately has no other checks. Only conclude that once
              # the grace period has passed and none have appeared.
              if [ "$elapsed" -ge "$REGISTER_GRACE_SECONDS" ]; then
                echo "No other checks registered after ${elapsed}s (expected for a data-only PR)."
                break
              fi
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after ${WAIT_TIMEOUT_SECONDS}s with $pending check(s) still pending - not auto-merging."
              exit 1
            fi

            echo "Waiting: $pending of $total check(s) still running (${elapsed}s elapsed)."
            sleep "$POLL_INTERVAL_SECONDS"
          done

      - name: Auto-merge PR
        if: steps.pr-details.outputs.is_automated == 'true'
        run: |
          PR_NUMBER="${{ steps.pr-details.outputs.pr_number }}"
          echo "Automated PR detected. Merging without approval requirement..."
          echo "Note: GitHub Pages deployment will be triggered automatically by the merge to main"
          gh pr merge $PR_NUMBER --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
