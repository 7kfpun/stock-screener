name: Daily Stock Data Update

on:
  schedule:
    # Two crons to handle DST — always targets 4:15 PM ET (15m after NYSE close)
    # EDT (Mar-Nov): 20:15 UTC = 4:15 PM ET
    - cron: "15 20 * * 1-5"
    # EST (Nov-Mar): 21:15 UTC = 4:15 PM ET
    - cron: "15 21 * * 1-5"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

# IMPORTANT: Repository Settings Required
# To allow GitHub Actions to create pull requests, you must enable:
# Settings → Actions → General → Workflow permissions
# → Check "Allow GitHub Actions to create and approve pull requests"

jobs:
  update-stock-data:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.create_pr.outputs.branch_name }}
      has_changes: ${{ steps.create_pr.outputs.has_changes }}

    steps:
      - name: Check if correct cron for current DST
        id: dst_check
        env:
          EVENT_NAME: ${{ github.event_name }}
          # The cron expression that triggered this run, verbatim from the
          # schedule block above. Keep the two values below in sync with it.
          TRIGGERING_CRON: ${{ github.event.schedule }}
          EDT_CRON: "15 20 * * 1-5"
          EST_CRON: "15 21 * * 1-5"
        run: |
          # Skip the DST check for manual runs and any non-schedule trigger.
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "$EVENT_NAME trigger detected - proceeding regardless of time"
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # GitHub cron is always UTC and has no DST awareness, so two crons
          # are registered and exactly one of them lands on 4:15 PM ET for a
          # given date. Decide which by the current ET UTC offset, then check
          # whether *this* run is the one that cron fired.
          #
          # Deliberately keyed off the triggering cron rather than the clock
          # at runner start: GitHub routinely delays scheduled runs past the
          # top of the hour, and the previous "is it 16:xx ET now?" check then
          # skipped both crons and silently lost the whole trading day while
          # still reporting success (e.g. 2026-08-10 through 2026-08-13).
          ET_OFFSET=$(TZ='America/New_York' date +%z)
          if [ "$ET_OFFSET" = "-0400" ]; then
            LIVE_CRON="$EDT_CRON"
            TZ_NAME="EDT"
          else
            LIVE_CRON="$EST_CRON"
            TZ_NAME="EST"
          fi

          if [ "$TRIGGERING_CRON" = "$LIVE_CRON" ]; then
            echo "Cron '$TRIGGERING_CRON' is the 4 PM ET cron under $TZ_NAME ($ET_OFFSET). Proceeding."
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "Cron '$TRIGGERING_CRON' is not the live cron under $TZ_NAME ($ET_OFFSET); '$LIVE_CRON' is. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.dst_check.outputs.skip != 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.dst_check.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.dst_check.outputs.skip != 'true'
        run: |
          pip install -r scripts/requirements.txt

      - name: Check if market is open
        if: steps.dst_check.outputs.skip != 'true'
        id: market_check
        run: |
          # Use Python script with accurate NYSE calendar (includes weekends and all holidays)
          if python scripts/is_market_open.py; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Run stock screener
        if: steps.dst_check.outputs.skip != 'true' && steps.market_check.outputs.skip != 'true'
        run: |
          # Use Eastern Time (NYSE timezone) for consistent date handling
          TODAY=$(TZ='America/New_York' date +%Y-%m-%d)
          echo "Fetching data for NYSE trading day: $TODAY ET"
          python scripts/fin.py > public/data/${TODAY}.csv

      - name: Update latest.csv
        if: steps.dst_check.outputs.skip != 'true' && steps.market_check.outputs.skip != 'true'
        run: |
          TODAY=$(TZ='America/New_York' date +%Y-%m-%d)
          cp public/data/${TODAY}.csv public/data/latest.csv

      - name: Update dates.csv
        if: steps.dst_check.outputs.skip != 'true' && steps.market_check.outputs.skip != 'true'
        run: |
          TODAY=$(TZ='America/New_York' date +%Y-%m-%d)
          if ! grep -q "^${TODAY}$" public/data/dates.csv; then
            echo "${TODAY}" >> public/data/dates.csv
          fi

      - name: Create Pull Request
        id: create_pr
        if: steps.dst_check.outputs.skip != 'true' && steps.market_check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          TODAY=$(TZ='America/New_York' date +%Y-%m-%d)
          # Add run number for uniqueness to avoid branch conflicts on reruns
          RUN_NUMBER="${{ github.run_number }}"
          BRANCH_NAME="stock-data-update-${TODAY}-${RUN_NUMBER}"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/*.csv

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

          # Create and switch to new branch
          git checkout -b ${BRANCH_NAME}
          git commit -m "data: update stock data ${TODAY}"

          # Push the new branch
          git push -u origin ${BRANCH_NAME}

          # Create PR using GitHub CLI (or update if exists)
          gh pr create \
            --title "Daily Stock Data Update - ${TODAY}" \
            --body "Automated daily stock data update for ${TODAY}.

          ## Changes
          - Updated \`public/data/${TODAY}.csv\` with latest stock data
          - Updated \`public/data/latest.csv\`
          - Updated \`public/data/dates.csv\`

          ## Automation
          This PR will be automatically reviewed by OpenRouter API, which will:
          - Verify all changes are correct
          - Generate stock summaries and save to \`public/data/summary/\`
          - Commit summary files to this PR
          - Post a comment with the top 5 stocks
          - Auto-merge if all checks pass" \
            --base main \
            --head ${BRANCH_NAME} \
            --label "automated" \
            --label "data-update" || {
            echo "::error::Failed to create pull request. Please ensure GitHub Actions has permission to create PRs."
            echo "::error::Go to: Settings → Actions → General → Workflow permissions"
            echo "::error::Enable: 'Allow GitHub Actions to create and approve pull requests'"
            exit 1
          }

  build:
    needs: update-stock-data
    if: needs.update-stock-data.outputs.has_changes == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.update-stock-data.outputs.branch_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
